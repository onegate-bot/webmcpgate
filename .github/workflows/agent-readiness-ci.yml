name: AI Agent Readiness CI Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to evaluate'
        required: true
        default: 'https://dev.zivisaiah.com'
      score_gate:
        description: 'Minimum Passing Score'
        required: true
        default: '9.0'

jobs:
  agent-readiness-evaluation:
    name: Universal AI Agent Compatibility Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Audit Against Target
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://dev.zivisaiah.com' }}
          AGENT_SCORE_GATE: ${{ github.event.inputs.score_gate || '9.0' }}
        run: |
          npx ts-node agent-readiness/cli.ts
